<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CESAVET | Iniciar sesión</title>
    <link rel="stylesheet" href="/css/cesavet-login.css">
    <link rel="stylesheet" href="/css/cesavet-login-ajustes.css">
</head>

<body>
    <main class="login-shell">
        <section class="presentation">

            <img class="login-panel-image" src="/img/iniciar.sesion.jpg" alt="CESAVET - Clínica Veterinaria">
            <div class="ces-bienvenida">

                <h1 class="ces-bienvenido">
                    Bienvenido a
                </h1>

                <h2 class="ces-nombre">
                    CESAVET
                </h2>

                <p class="ces-frase">
                    Cuidando a sus<br>
                    mejores amigos
                    <span class="ces-corazon">♥</span>
                </p>

            </div>

        </section>

        <section class="forms">

            <!-- RECEPCIONISTA -->
            <div class="role-card receptionist">
                <div class="role-title">
                    <span class="role-icon">
                        <svg viewBox="0 0 24 24" class="role-svg role-person">
                            <circle cx="12" cy="7" r="4" />
                            <path d="M4 21v-2a8 8 0 0 1 16 0v2z" />
                        </svg>
                    </span>
                    <h2>Recepcionista</h2>
                    <span class="card-paw">🐾</span>
                </div>

                <form action="/ingresar" method="post">
                    <input type="hidden" name="rol" value="Recepcionista">

                    <label>
                        <span class="field-icon">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="8" r="4" />
                                <path d="M4 21a8 8 0 0 1 16 0" />
                            </svg>
                        </span>
                        <input name="nombre" placeholder="Nombre" autocomplete="username" required>
                    </label>

                    <label>
                        <span class="field-icon">
                            <svg viewBox="0 0 24 24">
                                <rect x="5" y="10" width="14" height="11" rx="2" />
                                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                                <circle cx="12" cy="15" r="1" />
                            </svg>
                        </span>
                        <input name="clave" type="password" placeholder="Contraseña" autocomplete="current-password"
                            required>
                    </label>

                    <button type="submit">⇥ &nbsp; Iniciar sesión</button>
                </form>
            </div>

            <!-- VETERINARIO -->
            <div class="role-card vet">
                <div class="role-title">
                    <span class="role-icon">
                        <svg viewBox="0 0 24 24" class="role-svg role-stethoscope">
                            <path d="M6 4v5a6 6 0 0 0 12 0V4" />
                            <path d="M4 4h4M16 4h4" />
                            <path d="M12 15v2a4 4 0 0 0 8 0v-1" />
                            <circle cx="20" cy="13" r="1.5" />
                        </svg>
                    </span>
                    <h2>Veterinario</h2>
                    <span class="card-paw">🐾</span>
                </div>

                <form action="/ingresar" method="post">
                    <input type="hidden" name="rol" value="Veterinario">

                    <label>
                        <span class="field-icon">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="8" r="4" />
                                <path d="M4 21a8 8 0 0 1 16 0" />
                            </svg>
                        </span>
                        <input name="nombre" placeholder="Nombre" autocomplete="username" required>
                    </label>

                    <label>
                        <span class="field-icon">
                            <svg viewBox="0 0 24 24">
                                <rect x="5" y="10" width="14" height="11" rx="2" />
                                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                                <circle cx="12" cy="15" r="1" />
                            </svg>
                        </span>
                        <input name="clave" type="password" placeholder="Contraseña" autocomplete="current-password"
                            required>
                    </label>

                    <button type="submit">⇥ &nbsp; Iniciar sesión</button>
                </form>
            </div>

            __CES_LOGIN_ERROR__

        </section>


    </main>
    <footer>© Copyright 2026 CESAVET Clínica Veterinaria. Todos los derechos reservados | Cochabamba - Bolivia. | Equipo
        ESTRALS</footer>
</body>

</html>
